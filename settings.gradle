pluginManagement {
    repositories {

        mavenLocal()
        gradlePluginPortal()

        maven {
            url = uri('https://repo.foojay.io/maven/')
        }

        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}

include ":ct-dsl"
include ":ct-command"
include ":ct-gradle-plugin"
